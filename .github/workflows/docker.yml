on:
  schedule:
    - cron: '0 6 * * 0'
      timezone: 'Europe/Moscow'
  workflow_dispatch:
    inputs:
      deploy-only:
        description: 'Deploy only'
        type: boolean
permissions:
  contents: write
  packages: write
name: Docker
jobs:
  check_for_updates:
    name: Check for updates
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.updates.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up GitHub Actions user
        if: inputs.deploy-only != true
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Check for updates
        id: updates
        if: inputs.deploy-only != true
        shell: bash
        run: |
          latest_tag=$(curl -f -sS https://hub.docker.com/v2/namespaces/library/repositories/debian/tags/oldstable | jq -r '.digest')
          if [[ ! $latest_tag =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected digest: $latest_tag"
            exit 1
          fi

          current_tag=$(sed -En 's/^FROM debian:oldstable@([^ ]+) AS debian$/\1/p' Dockerfile)
          if [[ $current_tag == "$latest_tag" ]]; then
            echo "Dockerfile is up to date"
          else
            echo "Dockerfile is outdated"
            sed -i -E "s/^FROM debian:oldstable@[^ ]+/FROM debian:oldstable@$latest_tag/" Dockerfile
            # Dated tag sharing the digest, e.g. `oldstable-20261104`.
            latest_version=$(curl -f -sS "https://hub.docker.com/v2/namespaces/library/repositories/debian/tags?name=oldstable-&ordering=last_updated&page_size=100" | jq -r --arg digest "$latest_tag" 'first(.results[] | select(.digest == $digest and (.name | test("^oldstable-[0-9]+$"))) | .name) // empty')
            git commit -am "chore: update base image to debian:${latest_version:-oldstable@$latest_tag}"
            git push
            echo "commit=$(git rev-parse HEAD)" >>$GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy
    needs: check_for_updates
    if: needs.check_for_updates.outputs.commit != '' || inputs.deploy-only == true
    strategy:
      matrix:
        target:
          - debian
          - debian-freebsd
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.check_for_updates.outputs.commit }}
          fetch-depth: 0
      - name: Install QEMU
        uses: docker/setup-qemu-action@v4
      - name: Install Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Build Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ matrix.target }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
